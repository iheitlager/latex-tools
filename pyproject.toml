[project]
name = "latex-tools"
dynamic = ["version"]
description = "Latex command line tools"
readme = "README.md"
requires-python = ">=3.11"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest[dev]>=9.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",    
]

[project.scripts]
latex-processor = "latex_tools.cli.latex_processor:main"
doi-validator = "latex_tools.cli.doi_validator:main"
lated-diff = "latex_tools.cli.latex_diff_parser:main"
make-pdf = "latex_tools.cli.make_pdf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/latex_tools/__init__.py"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]


# Ruff linter configuration
# Select rules: E (errors), F (pyflakes), W (warnings), C90 (complexity), B (flake8-bugbear), I (isort)
[tool.ruff]
line-length = 120
select = ["E", "F", "W", "C90", "B", "B9", "I"]
exclude = ["__init__.py"]
ignore = [
    "D",    # docstring
    "E203", # whitespace
    "E501", # line length
    "W503", # operator
    "B950", # line length
]
